server.port=8080
spring.application.name=medikiosk-backend

# Fast2SMS Real SMS Gateway Configuration
fast2sms.api.key=DTk9Y7azSN0QIGjtRKelpAsZMXUvdCyO2miEqfWunVo3JhHxbPASHD5Cjy4lTUbhZ8d7MInQoBX1fwPm

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:medikioskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
